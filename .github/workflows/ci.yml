name: CI-CD Microservicio Node.js

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  pipeline:
    name: Pruebas, auditoría y despliegue simulado
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias de forma reproducible
        run: npm ci

      - name: Ejecutar pruebas y medir cobertura
        run: npm run test:ci

      - name: Auditoría de cumplimiento del proyecto
        run: npm run audit

      - name: Revisar vulnerabilidades de dependencias
        run: npm audit --audit-level=high

      - name: Desplegar microservicio y monitoreo con Docker Compose
        id: deploy
        run: |
          START_MS=$(date +%s%3N)
          docker compose --profile monitoring up --build -d

          for intento in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              echo "Healthcheck HTTP correcto."
              break
            fi
            if [ "$intento" -eq 30 ]; then
              docker compose --profile monitoring logs
              exit 1
            fi
            echo "Esperando al microservicio ($intento/30)..."
            sleep 2
          done

          for intento in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:9091/-/ready >/dev/null; then
              break
            fi
            if [ "$intento" -eq 20 ]; then
              docker compose --profile monitoring logs pushgateway
              exit 1
            fi
            sleep 1
          done

          END_MS=$(date +%s%3N)
          DURATION=$(awk "BEGIN { printf \"%.3f\", ($END_MS - $START_MS) / 1000 }")
          echo "deployment_duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "Duración del despliegue de prueba: ${DURATION}s"

      - name: Enviar métricas de cobertura y despliegue a Prometheus
        env:
          CI_DEPLOYMENT_DURATION_SECONDS: ${{ steps.deploy.outputs.deployment_duration }}
        run: node scripts/push-ci-metrics.js

      - name: Mostrar estado final de los contenedores
        if: always()
        run: docker compose --profile monitoring ps || true

      - name: Detener el entorno de prueba
        if: always()
        run: docker compose --profile monitoring down --remove-orphans || true
