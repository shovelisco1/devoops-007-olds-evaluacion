apiVersion: v1
kind: ConfigMap
metadata:
  name: microservicio-config
  namespace: microservicio
data:
  NODE_ENV: "production"
  PORT: "3000"
  SERVICE_NAME: "microservicio-evaluacion"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio
  namespace: microservicio
  labels:
    app: microservicio
    app.kubernetes.io/name: microservicio
    app.kubernetes.io/part-of: devops-ep3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio
  template:
    metadata:
      labels:
        app: microservicio
        app.kubernetes.io/name: microservicio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: microservicio
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: microservicio-config
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: microservicio
  namespace: microservicio
  labels:
    app: microservicio
    app.kubernetes.io/name: microservicio
spec:
  type: ClusterIP
  selector:
    app: microservicio
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
