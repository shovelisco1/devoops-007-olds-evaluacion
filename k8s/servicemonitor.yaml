apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: microservicio
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - microservicio
  selector:
    matchLabels:
      app: microservicio
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: prometheus-pushgateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
